name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The MCP server drives a real Microsoft Edge through Playwright, and the
    # plugin itself is Windows-only, so there is nothing to gain from Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build the real native executable before the contract suite. Without
      # this step native-contract.test.ts has to skip on a clean runner.
      - run: npm run build:mcp
      # Covers the shared core, the Total Commander viewer shell, the native
      # MCP server and the VS Code extension, and ends by
      # checking that no generated copy of the core has drifted.
      - run: npm test
      # C++ unit tests for the shared plugin code (encoding, JSON escaping,
      # form/meta path resolution). Only needs the MSVC toolset — no WebView2
      # SDK, since these tests don't touch webview2host.cpp.
      - run: tools\run-tests.bat
        shell: cmd

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File packages/1c-form-viewer/scripts/build-native.ps1 -Output releases/ci/1c-form-viewer-native-win-x64
      - run: npx --yes @vscode/vsce package --no-dependencies --target win32-x64 --out ../../releases/ci/1c-form-viewer-vscode-win32-x64.vsix
        working-directory: packages/1c-form-viewer-vscode
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            releases/ci/**
          if-no-files-found: error
