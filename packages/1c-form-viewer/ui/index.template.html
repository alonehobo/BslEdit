<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1C Form Viewer</title>
  <!-- CORE_STYLES -->
  <link rel="stylesheet" href="agent-viewer.css">
  <link rel="stylesheet" href="session-annotations.css">
</head>
<body>
<!-- ICON_SPRITE -->
<header id="agent-header">
  <button id="outline-toggle" type="button" aria-expanded="false" title="Показать панель элементов">☰</button>
  <strong id="agent-format">1C Form Viewer</strong>
  <span id="agent-path">Файл не открыт</span>
  <button id="annotation-toggle" type="button" aria-pressed="false" title="Добавить комментарий к элементу формы">✎ Аннотация</button>
  <button id="reload-preview" type="button" title="Перечитать файл с диска">⟳ Обновить</button>
</header>
<main id="agent-main">
  <aside id="outline-pane" aria-label="Элементы формы">
    <div id="outline-title">Элементы</div>
    <div id="outline"></div>
  </aside>
  <section id="agent-preview-pane">
    <div id="agent-empty">Вызовите MCP-инструмент open_preview.</div>
    <div id="preview" hidden></div>
    <form id="annotation-editor" hidden aria-label="Новая аннотация">
      <strong id="annotation-target"></strong>
      <textarea id="annotation-text" rows="3" placeholder="Опишите замечание" aria-label="Текст аннотации" required></textarea>
      <div class="annotation-actions"><button type="button" id="annotation-cancel">Отмена</button><button type="submit">Добавить</button></div>
    </form>
    <aside id="annotation-tray" hidden aria-label="Аннотации формы">
      <button id="annotation-tray-toggle" type="button" aria-expanded="true"></button>
      <ol id="annotation-list"></ol>
    </aside>
  </section>
</main>
<!-- CORE_SCRIPTS -->
<script src="session-annotations.js"></script>
<script src="agent-viewer.js"></script>
</body>
</html>
